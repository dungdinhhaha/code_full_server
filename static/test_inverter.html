<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverter Dashboard Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.1.12/Recharts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        /* Tùy chỉnh thanh cuộn cho màn hình nhỏ nếu cần */
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5B5FEF', // Xanh tím
                        success: '#10B981', // Xanh lá
                        danger: '#EF4444',  // Đỏ
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
        const { useState, useEffect } = React;
        const { LineChart, Line, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = window.Recharts;

        // Icons SVG
        const IconWave = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-primary">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        );

        const IconPower = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
        );

        const IconActivity = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-500">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
        );

        const App = () => {
            // State data binding (Mock ID=1)
            const [data, setData] = useState({
                inverter_status: 1, // 1: Chạy, 0: Dừng
                actual_pressure: 1.25,
                set_pressure: 1.5,
                input_voltage: 242.5,
                input_current: 2.1,
                output_voltage: 220.0,
                output_current: 1.9,
                frequency: 45.5,
                pid_gain: 2.5,
                pid_integral: 1.2,
                pid_derivative: 0.1,
                plc_q7: 0,
                mode: 'manual',
                pressure_history: []
            });

            // UI State
            const [isLocked, setIsLocked] = useState(false); // Trái (false) = Cho phép sửa, Phải (true) = Khóa
            const [lockCooldown, setLockCooldown] = useState(0); // Cooldown timer (30s)
            const [permissions, setPermissions] = useState([]);

            // Initialize history
            useEffect(() => {
                const initHistory = Array.from({length: 15}, (_, i) => {
                    const time = new Date(Date.now() - (15 - i) * 2000);
                    return {
                        time: time.toLocaleTimeString([], {minute:'2-digit', second:'2-digit'}),
                        actual: 0,
                        set: 1.5
                    };
                });
                setData(prev => ({...prev, pressure_history: initHistory}));
            }, []);

            // Socket push method (được gọi từ NiceGUI)
            useEffect(() => {
                window.updateInverterData = (apiData) => {
                    setData(prev => {
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString([], {minute:'2-digit', second:'2-digit'});
                        
                        const newHistory = [...prev.pressure_history.slice(1), {
                            time: timeStr,
                            actual: apiData.actual_pressure,
                            set: apiData.set_pressure
                        }];

                        return {
                            ...prev,
                            ...apiData,
                            pressure_history: newHistory
                        };
                    });
                    
                    // Đồng bộ trạng thái khóa và cooldown từ server
                    if (apiData.is_locked !== undefined) {
                        setIsLocked(apiData.is_locked);
                    }
                    if (apiData.cooldown !== undefined) {
                        setLockCooldown(apiData.cooldown);
                    }
                    if (apiData.permissions !== undefined) {
                        setPermissions(apiData.permissions);
                    }
                };
                
                return () => {
                    window.updateInverterData = null;
                };
            }, []);

            const toggleLock = () => {
                if (lockCooldown > 0) return;
                
                const nextState = !isLocked;
                setIsLocked(nextState);
                
                if (window.emitEvent) {
                    window.emitEvent('inverter_control', { bit: nextState ? 1 : 0 });
                } else if (window.socket) {
                    window.socket.emit('inverter_control', { bit: nextState ? 1 : 0 });
                }
                
                setLockCooldown(30);
            };

            useEffect(() => {
                if (lockCooldown > 0) {
                    const timer = setTimeout(() => setLockCooldown(c => c - 1), 1000);
                    return () => clearTimeout(timer);
                }
            }, [lockCooldown]);

            const handlePidChange = (field, val) => {
                if(isLocked) return;
                setData(prev => ({ ...prev, [field]: val }));
            };

            const handleSetPressureChange = (e) => {
                const val = parseFloat(e.target.value);
                if(!isNaN(val)) setData(prev => ({...prev, set_pressure: val}));
            };

            // Tính công suất tải dựa trên tần số (Biến tần 0-50Hz)
            const isRun = data.inverter_status === 1;
            const maxFrequency = 50.0;
            const progressPercent = isRun ? Math.min((data.frequency / maxFrequency) * 100, 100) : 0;

            return (
                <div className="w-full flex-1 p-2 md:p-4 flex flex-col gap-4 h-full min-h-screen">
                    
                    {/* Header */}
                    <header className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-[14px] bg-white shadow-sm flex items-center justify-center border border-gray-100">
                            <IconWave />
                        </div>
                        <div>
                            <h1 className="text-xl font-bold tracking-tight text-slate-800">Biến Tần Inverter</h1>
                            <p className="text-xs font-medium text-slate-500 mt-0.5">Giám sát áp suất và điều khiển PID hệ thống tưới</p>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 flex-1 w-full">
                        
                        {/* CỘT TRÁI - ĐIỀU KHIỂN & THÔNG SỐ (3 CỘT) */}
                        <div className="lg:col-span-3 flex flex-col gap-4">
                            
                            {/* CHẾ ĐỘ VẬN HÀNH */}
                            <div className="glass-card p-4 flex flex-col gap-3 rounded-[28px] shadow-sm border-white">
                                <div className="flex justify-between items-center px-1">
                                    <div className="text-[10px] font-black text-slate-400 tracking-widest uppercase">Thiết lập Chế độ</div>
                                    <div className={`text-[9px] font-black px-2.5 py-1 rounded-full uppercase tracking-widest ${data.mode === 'auto' ? 'bg-cyan-100 text-cyan-600' : 'bg-amber-100 text-amber-600'}`}>
                                        {data.mode === 'auto' ? 'Auto Mode' : 'Manual Mode'}
                                    </div>
                                </div>
                                <div className="flex items-center justify-center gap-6 py-2">
                                    <span className={`text-[11px] font-black tracking-widest transition-colors duration-300 ${data.mode === 'manual' ? 'text-amber-500' : 'text-slate-300'}`}>MANUAL</span>
                                    <button 
                                        onClick={() => {
                                            const newMode = data.mode === 'auto' ? 'manual' : 'auto';
                                            if (window.emitEvent) window.emitEvent('inverter_mode_change', { mode: newMode });
                                        }}
                                        title={!permissions.includes('inverter_change_mode') ? 'Quyền hạn: Không cho phép đổi chế độ' : 'Nhấp để đổi chế độ'}
                                        className={`relative h-6 w-11 rounded-full transition-all duration-500 focus:outline-none shadow-inner ${data.mode === 'auto' ? 'bg-cyan-500 shadow-cyan-500/20' : 'bg-amber-500 shadow-amber-500/20'} ${!permissions.includes('inverter_change_mode') ? 'opacity-40 grayscale cursor-not-allowed' : 'hover:scale-110 active:scale-90'}`}
                                    >
                                        <span className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all duration-500 shadow-sm ${data.mode === 'auto' ? 'left-[22px]' : 'left-[4px]'}`} />
                                    </button>
                                    <span className={`text-[11px] font-black tracking-widest transition-colors duration-300 ${data.mode === 'auto' ? 'text-cyan-500' : 'text-slate-300'}`}>AUTO</span>
                                </div>
                            </div>

                            {/* THẺ ĐIỀU KHIỂN CHÍNH */}
                            <div className="glass-card p-4 md:p-5 flex flex-col gap-4 rounded-[28px] shadow-md border-white">
                                
                                {/* Dòng TRẠNG THÁI BƠM */}
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-[14px] shadow-inner flex items-center justify-center transition-colors duration-500 border ${isRun ? 'bg-primary/10 text-primary border-primary/20' : 'bg-gray-50 text-gray-400 border-gray-200'}`}>
                                            <IconPower />
                                        </div>
                                        <div>
                                            <div className="text-[10px] font-black text-slate-400 tracking-widest uppercase">Trạng thái Bơm</div>
                                            <div className={`text-sm font-black ${isRun ? 'text-success' : 'text-danger'}`}>
                                                {isRun ? '○ ĐANG CHẠY' : '○ ĐANG DỪNG'}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-center gap-1">
                                        {data.mode === 'auto' ? (
                                            <div className="flex flex-col items-center opacity-60" title="Chế độ Auto đang bật - Không thể điều khiển tay">
                                                 <div className={`relative inline-flex h-6 w-11 items-center rounded-full ${isRun ? 'bg-cyan-500 shadow-cyan-500/30' : 'bg-gray-200'} cursor-not-allowed transition-colors duration-300`}>
                                                    <span className={`inline-block w-4 h-4 transform bg-white rounded-full ${isRun ? 'translate-x-6' : 'translate-x-1'} shadow-sm transition-transform duration-300`} />
                                                </div>
                                                <span className={`text-[8px] font-black ${isRun ? 'text-cyan-500' : 'text-slate-400'} uppercase mt-1`}>{isRun ? 'Auto: ON' : 'Auto Lock'}</span>
                                            </div>
                                        ) : permissions.includes('inverter_toggle_control') ? (
                                            <>
                                                <button 
                                                    onClick={toggleLock}
                                                    disabled={lockCooldown > 0}
                                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-300 focus:outline-none ${isLocked ? 'bg-amber-400 shadow-amber-400/30' : 'bg-gray-300'} shadow-sm disabled:opacity-50 disabled:cursor-not-allowed`}
                                                    title="Bật/Tắt máy bơm (Manual)"
                                                >
                                                    <span className={`inline-block w-4 h-4 transform bg-white rounded-full transition-transform duration-300 shadow-sm ${isLocked ? 'translate-x-6' : 'translate-x-1'}`} />
                                                </button>
                                                <span className="text-[9px] font-bold text-slate-400 uppercase">
                                                    {lockCooldown > 0 ? `Chờ ${lockCooldown}s` : (isLocked ? 'Đang bật' : 'Đang tắt')}
                                                </span>
                                            </>
                                        ) : (
                                            <>
                                                <div className="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-200 cursor-not-allowed opacity-60">
                                                    <span className="inline-block w-4 h-4 transform bg-white rounded-full translate-x-1 shadow-sm" />
                                                </div>
                                                <span className="text-[9px] font-bold text-slate-400 uppercase flex items-center gap-0.5">
                                                    <span>🔒 Khóa</span>
                                                </span>
                                            </>
                                        )}
                                    </div>
                                </div>


                            {/* Khối Áp suất thực tế / Cài đặt */}
                            <div>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div className="bg-[#f8fafc] p-3 rounded-[16px] border border-gray-100/80 shadow-sm">
                                        <div className="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Thực tế</div>
                                        <div className="flex items-baseline gap-1">
                                            <span className="text-2xl font-black text-slate-800 tabular-nums">{data.actual_pressure.toFixed(2)}</span>
                                            <span className="text-[10px] font-bold text-slate-400">BAR</span>
                                        </div>
                                    </div>
                                    <div className="bg-[#f8fafc] p-3 rounded-[16px] border border-gray-100/80 shadow-sm">
                                        <div className="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Cài đặt</div>
                                        <div className="flex items-baseline gap-1">
                                            <input 
                                                type="number" 
                                                step="0.1"
                                                value={data.set_pressure}
                                                onChange={handleSetPressureChange}
                                                disabled={isLocked || !permissions.includes('inverter_toggle_control') || data.mode === 'auto'}
                                                className="w-[60px] bg-transparent border-b-2 border-slate-300 px-1 py-0 text-xl font-black text-slate-800 focus:outline-none focus:border-primary disabled:opacity-50 transition-colors"
                                            />
                                            <span className="text-[10px] font-bold text-slate-400">BAR</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Progress bar */}
                                <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden shadow-inner">
                                    <div 
                                        className={`h-full rounded-full transition-all duration-500 ease-out relative ${isRun ? 'bg-primary' : 'bg-gray-300'}`}
                                        style={{ width: `${progressPercent}%` }}
                                    >
                                        <div className="absolute top-0 left-0 right-0 bottom-0 bg-white/20"></div>
                                    </div>
                                </div>
                                <div className="text-[10px] font-bold text-slate-400 text-right mt-1.5 flex justify-between uppercase tracking-widest">
                                    <span>Tải Inverter</span>
                                    <span>Công suất {progressPercent.toFixed(0)}%</span>
                                </div>
                            </div>

                            <hr className="border-gray-100" />

                            {/* 2 Card Nhỏ: V/A Input & Output + Khối Tần số gom lại để nhìn gọn hơn */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white p-3 rounded-[16px] border-l-4 border-l-blue-400 border border-gray-100 shadow-sm flex flex-col justify-between">
                                    <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Đầu vào</div>
                                    <div className="grid grid-cols-2 gap-1 mt-auto">
                                        <div>
                                            <div className="text-[9px] text-slate-400 font-bold">VOLT</div>
                                            <div className="text-xs font-bold text-slate-800">{data.input_voltage}V</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[9px] text-slate-400 font-bold">CURR</div>
                                            <div className="text-xs font-bold text-slate-800">{data.input_current.toFixed(2)}A</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white p-3 rounded-[16px] border-l-4 border-l-success border border-gray-100 shadow-sm flex flex-col justify-between">
                                    <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Đầu ra</div>
                                    <div className="grid grid-cols-2 gap-1 mt-auto">
                                        <div>
                                            <div className="text-[9px] text-slate-400 font-bold">VOLT</div>
                                            <div className="text-xs font-bold text-slate-800">{data.output_voltage}V</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[9px] text-slate-400 font-bold">CURR</div>
                                            <div className="text-xs font-bold text-slate-800">{data.output_current.toFixed(2)}A</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Khối Tần số */}
                            <div className="bg-[#fffbeb] border border-amber-100 p-3 rounded-[16px] flex items-center justify-between shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-[12px] bg-amber-400 text-white flex items-center justify-center shadow-md shadow-amber-400/20">
                                        <IconActivity />
                                    </div>
                                    <div>
                                        <div className="text-[9px] font-bold text-amber-600/70 uppercase tracking-widest">Tần số vận hành</div>
                                        <div className="flex items-baseline gap-1">
                                            <span className="text-xl font-black text-amber-600 tabular-nums leading-none">{isRun ? data.frequency.toFixed(1) : '0.0'}</span>
                                            <span className="text-xs font-bold text-amber-600/70">Hz</span>
                                        </div>
                                    </div>
                                </div>
                                {isRun && (
                                    <span className="px-2 py-0.5 text-[9px] font-black bg-success text-white rounded-full uppercase tracking-widest animate-pulse shadow-sm shadow-success/40">
                                        Online
                                    </span>
                                )}
                            </div>

                            <hr className="border-gray-100" />

                            {/* Khối PID */}
                            <div className="bg-white border border-gray-100 shadow-sm p-4 rounded-[20px]">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                                        Điều khiển PID
                                    </h3>
                                    {isLocked && <span className="text-[8px] text-white bg-amber-500 font-bold uppercase px-1.5 py-0.5 rounded-[4px] tracking-wider shadow-sm">Khóa</span>}
                                </div>
                                
                                <div className="space-y-2 mb-4 p-2 rounded-[12px] bg-slate-50 border border-slate-100">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[10px] font-bold text-slate-500 font-mono">Gain (P)</label>
                                        <input type="number" step="0.1" value={data.pid_gain} onChange={(e) => handlePidChange('pid_gain', e.target.value)} disabled={isLocked || data.mode === 'auto'}
                                            className="w-14 bg-white border border-gray-200 rounded-md px-1 py-0.5 text-xs font-bold text-slate-800 text-center focus:outline-none focus:border-primary disabled:opacity-50 shadow-sm" />
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <label className="text-[10px] font-bold text-slate-500 font-mono">Integral (I)</label>
                                        <input type="number" step="0.1" value={data.pid_integral} onChange={(e) => handlePidChange('pid_integral', e.target.value)} disabled={isLocked || data.mode === 'auto'}
                                            className="w-14 bg-white border border-gray-200 rounded-md px-1 py-0.5 text-xs font-bold text-slate-800 text-center focus:outline-none focus:border-primary disabled:opacity-50 shadow-sm" />
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <label className="text-[10px] font-bold text-slate-500 font-mono">Deriv (D)</label>
                                        <input type="number" step="0.1" value={data.pid_derivative} onChange={(e) => handlePidChange('pid_derivative', e.target.value)} disabled={isLocked || data.mode === 'auto'}
                                            className="w-14 bg-white border border-gray-200 rounded-md px-1 py-0.5 text-xs font-bold text-slate-800 text-center focus:outline-none focus:border-primary disabled:opacity-50 shadow-sm" />
                                    </div>
                                </div>

                                <button 
                                    onClick={() => {
                                        if (isLocked) return;
                                        if (!permissions.includes('inverter_send_data')) {
                                            alert("Bạn không có quyền gửi dữ liệu Inverter!");
                                            return;
                                        }
                                        if (window.emitEvent) {
                                            window.emitEvent('inverter_pid_sync', {
                                                kp: parseFloat(data.pid_gain),
                                                ki: parseFloat(data.pid_integral),
                                                kd: parseFloat(data.pid_derivative),
                                                p_set: parseFloat(data.set_pressure)
                                            });
                                        }
                                    }} 
                                    disabled={isLocked || !permissions.includes('inverter_send_data') || data.mode === 'auto'}
                                    className="w-full bg-slate-800 hover:bg-slate-900 disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none text-white font-bold tracking-widest py-2 text-[10px] rounded-[10px] transition-all duration-300 shadow-sm active:scale-[0.98] uppercase"
                                >
                                    ĐỒNG BỘ DỮ LIỆU
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* CỘT PHẢI - CHART */}
                        <div className="lg:col-span-9 flex flex-col w-full min-w-0">
                            <div className="glass-card p-4 md:p-6 flex-1 flex flex-col rounded-[28px] w-full">
                                
                                {/* Chart Header */}
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-800 mb-1">Biểu đồ Áp suất Hệ thống</h2>
                                        <p className="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Đơn vị: BAR (Real-time)</p>
                                    </div>
                                    <div className={`px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm ${data.plc_q7 === 1 ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'}`}>
                                        {data.plc_q7 === 1 ? 'Bơm đang Chạy' : 'Bơm đang Tắt'}
                                    </div>
                                </div>

                                {/* Custom Legend */}
                                <div className="flex items-center gap-4 mb-4 px-2">
                                    <div className="flex items-center gap-1.5">
                                        <div className="w-2 h-0.5 bg-gray-400 border border-dashed border-gray-400"></div>
                                        <span className="text-xs font-medium text-slate-600">Áp suất cài đặt</span>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <div className="w-2 h-2 rounded bg-primary"></div>
                                        <span className="text-xs font-medium text-slate-600">Áp suất hiện tại</span>
                                    </div>
                                </div>

                                {/* Chart Container */}
                                <div className="flex-1 w-full min-h-[200px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={data.pressure_history} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                            <defs>
                                                <linearGradient id="colorActual" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#5B5FEF" stopOpacity={0.2}/>
                                                    <stop offset="95%" stopColor="#5B5FEF" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis 
                                                dataKey="time" 
                                                axisLine={false} 
                                                tickLine={false} 
                                                tick={{ fill: '#94a3b8', fontSize: 12, fontWeight: 500 }}
                                                dy={10}
                                            />
                                            <YAxis 
                                                domain={[0, 2]} 
                                                axisLine={false} 
                                                tickLine={false} 
                                                tick={{ fill: '#94a3b8', fontSize: 12, fontWeight: 500 }}
                                            />
                                            <Tooltip 
                                                contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 4px 20px rgba(0,0,0,0.1)', fontWeight: 600 }}
                                                itemStyle={{ color: '#0f172a' }}
                                            />
                                            
                                            {/* Đường cài đặt (nét đứt xám) */}
                                            <Line type="monotone" dataKey="set" stroke="#94a3b8" strokeWidth={2} strokeDasharray="5 5" dot={false} isAnimationActive={false} />
                                            
                                            {/* Đường thực tế (Area + Line) */}
                                            <Area type="monotone" dataKey="actual" stroke="#5B5FEF" strokeWidth={3} fillOpacity={1} fill="url(#colorActual)" isAnimationActive={false} />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                                
                            </div>
                        </div>

                    </div>

                    {/* Card thông báo quyền hạn mới ở dưới cùng */}
                    <div className="glass-card p-4 md:p-5 flex flex-col gap-3 rounded-[24px] shadow-md border-white mt-4">
                        <div className="text-[10px] font-black text-slate-400 tracking-widest uppercase mb-1">Quyền hạn của tài khoản</div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="flex items-center gap-2 text-success font-medium">
                                    <span className="text-lg">✓</span>
                                    <span className="text-xs">Giám sát thông số thời gian thực</span>
                                </div>
                                {permissions.includes('inverter_toggle_control') ? (
                                    <div className="flex items-center gap-2 text-success font-medium">
                                        <span className="text-lg">✓</span>
                                        <span className="text-xs">Điều khiển Bật/Tắt Biến tần</span>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2 text-danger font-medium">
                                        <span className="text-lg">✗</span>
                                        <span className="text-xs">Bị khóa Bật/Tắt Biến tần</span>
                                    </div>
                                )}
                                {permissions.includes('inverter_send_data') ? (
                                    <div className="flex items-center gap-2 text-success font-medium">
                                        <span className="text-lg">✓</span>
                                        <span className="text-xs">Đồng bộ dữ liệu cài đặt PID</span>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2 text-danger font-medium">
                                        <span className="text-lg">✗</span>
                                        <span className="text-xs">Bị khóa cài đặt PID</span>
                                    </div>
                                )}
                                {permissions.includes('inverter_change_mode') ? (
                                    <div className="flex items-center gap-2 text-success font-medium">
                                        <span className="text-lg">✓</span>
                                        <span className="text-xs">Thiết lập chế độ Auto/Manual</span>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2 text-danger font-medium">
                                        <span className="text-lg">✗</span>
                                        <span className="text-xs">Bị khóa đổi chế độ A/M</span>
                                    </div>
                                )}
                            </div>
                        </div>
                </div>
            );
        };

        const rootElem = document.getElementById('root');
        if (rootElem) {
            const root = ReactDOM.createRoot(rootElem);
            root.render(<App />);
        }
    })();
    </script>
</body>
</html>
